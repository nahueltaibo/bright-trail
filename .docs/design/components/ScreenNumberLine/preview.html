<!-- @dsCard group="Kid screens" height=1920 width=1860 page subtitle="Number line item: phone and tablet" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ScreenNumberLine — preview</title></head>
<body style="margin:0">
<div id="root" class=""></div>
<script>
var B = window.BrightTrail, h = React.createElement, S = B.Screens;
function cell(label, el) { return h('div', { className: 'bt-pv-cell' }, el, h('span', { className: 'bt-pv-label' }, label)); }
function D(kind, label, el, zone, extra) { return h(B.Device, Object.assign({ key: kind + label, kind: kind, label: label, zone: zone }, extra || {}), el); }
ReactDOM.createRoot(document.getElementById('root')).render(h(B.Board, { rows: [
  [D('phone', 'Placing', h(S.NumberLine, {})), D('phone', 'Answered right', h(S.NumberLine, { state: 'right' })), D('phone', 'Answered wrong: correct spot shown', h(S.NumberLine, { state: 'wrong' }))],
  [D('tablet', 'Answered wrong', h(S.NumberLine, { state: 'wrong', land: true }))]
] }));
</script>
</body>
</html>
