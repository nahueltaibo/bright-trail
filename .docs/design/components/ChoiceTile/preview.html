<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChoiceTile — preview</title></head>
<body style="margin:0">
<div id="root" class="bt-kid bt-pv"></div>
<script>
var B = window.BrightTrail, h = React.createElement, S = B.Screens;
function cell(label, el) { return h('div', { className: 'bt-pv-cell' }, el, h('span', { className: 'bt-pv-label' }, label)); }
function D(kind, label, el, zone, extra) { return h(B.Device, Object.assign({ key: kind + label, kind: kind, label: label, zone: zone }, extra || {}), el); }
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, cell('idle', h(B.ChoiceTile, { label: '7' })),
  cell('right', h(B.ChoiceTile, { label: '7', state: 'right' })),
  cell('missed', h(B.ChoiceTile, { label: '8', state: 'missed' })),
  cell('rest', h(B.ChoiceTile, { label: '6', state: 'rest' })),
  cell('emoji', h(B.ChoiceTile, { label: '🍎🍎', ariaLabel: 'two apples' }))));
</script>
</body>
</html>
