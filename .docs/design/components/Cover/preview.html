<!doctype html>
<html>
<head><meta charset="utf-8"><title>BrightTrail — cover</title>
<style>
  html, body { margin: 0; }
  .cv { position: relative; width: 960px; height: 288px; background: var(--kid-bg); overflow: hidden; }
  .cv svg { position: absolute; inset: 0; }
  .trail { fill: var(--trail); }
  .ink { fill: var(--kid-ink); }
  .sun { fill: var(--sun); }
  .star { fill: var(--star); }
  .stone { fill: var(--kid-bg); }
  .walk { fill: none; stroke: var(--kid-bg); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 0 22; }
  .pill { rx: 88px; } .slab { rx: var(--radius-xl); } .tile { rx: var(--radius-lg); }
  .txt { position: absolute; left: 48px; bottom: 44px; max-width: 420px; }
  .name { font: 800 64px/0.95 var(--font-display); color: var(--kid-ink); margin: 0; }
  .tag { font: 400 14px/20px var(--font-body); color: var(--kid-ink-soft); margin: 12px 0 0; }
</style></head>
<body>
<div class="cv">
  <!--
    blocks: trail 392x176 pill, kid-ink 160x160 at radius-xl, sun 288x96 at radius-lg, star disc r40 (space-12 + space-8 scale)
    arrangement: a trail pill bleeding off the top-right, an ink slab bleeding off the bottom, a sun tile between them, a star rising above
    pattern: stepping stones (literal motif) because the name is a trail a child walks: nine kid-bg discs cut along one curve
    scales: stone r 12 (space-3), pitch 22, radii radius-xl 32, radius-lg 22, pill = half of 176
  -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="trail pill" x="600" y="-32" width="392" height="176" rx="88"/>
    <rect class="ink slab" x="512" y="176" width="160" height="160"/>
    <rect class="sun tile" x="696" y="168" width="296" height="96"/>
    <circle class="star" cx="552" cy="76" r="40"/>
    <circle class="stone" cx="540" cy="236" r="12"/>
    <circle class="stone" cx="604" cy="214" r="12"/>
    <circle class="stone" cx="664" cy="184" r="12"/>
    <circle class="stone" cx="728" cy="150" r="12"/>
    <circle class="stone" cx="786" cy="118" r="12"/>
    <circle class="stone" cx="840" cy="92" r="12"/>
    <circle class="stone" cx="888" cy="70" r="12"/>
    <circle class="stone" cx="930" cy="52" r="12"/>
  </svg>
  <div class="txt">
    <h1 class="name">BrightTrail</h1>
    <p class="tag">A bright trail through Ontario math, one star at a time.</p>
  </div>
</div>
</body>
</html>
