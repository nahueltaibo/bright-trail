<!-- @dsCard group="Kid screens" height=1920 width=1860 page subtitle="Story card viewer: phone and tablet" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ScreenStory — preview</title></head>
<body style="margin:0">
<div id="root" class=""></div>
<script>
var B = window.BrightTrail, h = React.createElement, S = B.Screens;
function cell(label, el) { return h('div', { className: 'bt-pv-cell' }, el, h('span', { className: 'bt-pv-label' }, label)); }
function D(kind, label, el, zone, extra) { return h(B.Device, Object.assign({ key: kind + label, kind: kind, label: label, zone: zone }, extra || {}), el); }
ReactDOM.createRoot(document.getElementById('root')).render(h(B.Board, { rows: [
  [D('phone', 'Card 2 of 6', h(S.Story, { card: 1, index: 1 })), D('phone', 'Last card: Done', h(S.Story, { card: 3, index: 5 })), D('phone', 'Flagged, reading mode', h(S.Story, { card: 0, index: 0, flagged: true, reading: true }))],
  [D('tablet', 'Card 3 of 6: Back and Next on the sides', h(S.Story, { card: 2, index: 2, land: true }))]
] }));
</script>
</body>
</html>
