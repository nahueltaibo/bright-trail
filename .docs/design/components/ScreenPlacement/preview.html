<!-- @dsCard group="Kid screens" height=1920 width=1860 page subtitle="Placement: phone and tablet" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ScreenPlacement — preview</title></head>
<body style="margin:0">
<div id="root" class=""></div>
<script>
var B = window.BrightTrail, h = React.createElement, S = B.Screens;
function cell(label, el) { return h('div', { className: 'bt-pv-cell' }, el, h('span', { className: 'bt-pv-label' }, label)); }
function D(kind, label, el, zone, extra) { return h(B.Device, Object.assign({ key: kind + label, kind: kind, label: label, zone: zone }, extra || {}), el); }
ReactDOM.createRoot(document.getElementById('root')).render(h(B.Board, { rows: [
  [D('phone', 'Intro', h(S.Placement, { step: 'intro' })), D('phone', 'Item with pause', h(S.Placement, { step: 'item' })), D('phone', 'Paused', h(S.Placement, { step: 'pause' })), D('phone', 'End', h(S.Placement, { step: 'end' }))],
  [D('tablet', 'Intro', h(S.Placement, { step: 'intro', land: true }))]
] }));
</script>
</body>
</html>
