name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fails a pull request that changes the native side without bumping the major version.
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  # Each change on main reaches family devices one of two ways. A major version bump builds a new
  # APK as a GitHub release. Anything else ships as an OTA update to the APKs already installed.
  ship:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Where the app downloads content packs. The OTA update and the APK both bake it in.
      EXPO_PUBLIC_CONTENT_URL: ${{ vars.EXPO_PUBLIC_CONTENT_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: plan
        run: node scripts/release.mjs

      # Packs go up before the app that reads them. Skipped with a warning while R2_* are unset.
      - run: npm run content:publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # Signed APKs reject unsigned updates, so a missing key fails the step.
      - if: steps.plan.outputs.mode == 'ota'
        run: |
          if [ -z "$EXPO_UPDATES_PRIVATE_KEY" ]; then
            echo "::error::EXPO_UPDATES_PRIVATE_KEY is not set. Nothing was published."
            exit 1
          fi
          export EXPO_UPDATES_PRIVATE_KEY_PATH="$RUNNER_TEMP/updates-private-key.pem"
          printf '%s\n' "$EXPO_UPDATES_PRIVATE_KEY" > "$EXPO_UPDATES_PRIVATE_KEY_PATH"
          npm run ota:publish -- --no-checks --message "$(git log -1 --format=%s)"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_UPDATES_PRIVATE_KEY: ${{ secrets.EXPO_UPDATES_PRIVATE_KEY }}

      - if: steps.plan.outputs.mode == 'apk'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - if: steps.plan.outputs.mode == 'apk'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - if: steps.plan.outputs.mode == 'apk'
        name: Write the release key
        run: |
          echo "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > "$RUNNER_TEMP/release.properties"
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - if: steps.plan.outputs.mode == 'apk'
        run: npm run android:build:family
        env:
          BRIGHT_TRAIL_SIGNING: ${{ runner.temp }}/release.properties
      - if: steps.plan.outputs.mode == 'apk'
        name: Publish the release
        run: |
          echo "$FINGERPRINT" > "$RUNNER_TEMP/fingerprint.txt"
          gh release create "v$VERSION" dist/*.apk "$RUNNER_TEMP/fingerprint.txt" \
            --target "$GITHUB_SHA" --title "BrightTrail $VERSION" \
            --notes "Install over the old app, never uninstall first. Updates until the next major version arrive over the air."
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
