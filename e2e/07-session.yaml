appId: com.nahueltaibo.brighttrail
name: Session with placement
---
# A child born six years back is in Grade 1. Every answer here is wrong, which walks placement
# from Grade 1 down to Kindergarten. The wrong choices are pinned to bundle 2026.11.07-53: after a
# content rebuild, replay placement with all-wrong answers and update them.
- runFlow: subflows/launch-clean.yaml
- runFlow: subflows/set-pin.yaml
- runFlow:
    file: subflows/add-child.yaml
    env:
      NAME: Maya
      AVATAR: Owl
- tapOn: Kids’ home
- tapOn: Maya, Owl
- tapOn: Let’s go

# Placement, Grade 1: fair shares, a tap item then a keypad item.
- extendedWaitUntil:
    visible: This looks wrong
    timeout: 10000
- tapOn: '3'
- assertVisible: Good try!
- tapOn: Next
- tapOn: '1'
- tapOn: Check my answer
- assertVisible: Good try!
- tapOn: Next

# Quit on the third item, flag it, and come back: placement resumes on the same item.
- assertVisible: 7 \+ 2 = \?
- tapOn: This looks wrong
- assertVisible: Thanks for telling us
- tapOn: Stop for now
- assertVisible: Hi, Maya!
- tapOn: Let’s go
- extendedWaitUntil:
    visible: 7 \+ 2 = \?
    timeout: 10000

# Placement, Grade 1: adding to 10. Then Kindergarten: counting, then reading numbers.
- tapOn: '8'
- assertVisible: Good try!
- tapOn: Next
- tapOn: '4'
- assertVisible: Good try!
- tapOn: Next
- tapOn: '15'
- assertVisible: Good try!
- tapOn: Next
- tapOn: '7'
- assertVisible: Good try!
- tapOn: Next
- tapOn: '10'
- assertVisible: Good try!
- tapOn: Next
- tapOn: '3'
- assertVisible: Good try!
- tapOn: Next

# Placement is done, so the first lesson starts: the story, then its check.
- assertVisible: Card 1 of \d+
- repeat:
    while:
      notVisible: Done
    commands:
      - tapOn: Next
- tapOn: Done
- assertNotVisible: Card \d+ of \d+
- assertVisible: This looks wrong
- tapOn: Stop for now
- assertVisible: Hi, Maya!

# The parent sees what placement found and the flag.
- tapOn: Back to profiles
- tapOn: Parent area
- runFlow: subflows/enter-pin.yaml
- tapOn: Maya, .*
- tapOn: Placement review
- assertVisible: Placed at Kindergarten\.
- assertVisible: 4 placed skills
- assertVisible: .*0 of 2 right
- tapOn: Maya
- tapOn: Grown-ups
- tapOn: See flags
- assertVisible: Open \(1\)
