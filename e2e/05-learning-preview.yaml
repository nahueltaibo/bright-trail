appId: com.nahueltaibo.brighttrail
name: Learning preview
---
# Plays one skill of the real bundle. Answers come from the preview's dev bar, so the flow
# doesn't depend on generated wording, only on the skill and item ids.
- runFlow: subflows/launch-clean.yaml
- tapOn: 'Dev: learning preview'
- assertVisible: Learning preview
- tapOn: .*k-count-to-20
- assertVisible: .*k-count-to-20-story

# Story cards: next, back, flag, done.
- tapOn: .*k-count-to-20-story
- assertVisible: Card 1 of \d+
- assertVisible:
    text: Back
    leftOf: Next
    enabled: false
- tapOn: Next
- assertVisible: Card 2 of \d+
# leftOf keeps the tap off the phone's own nav-bar Back button.
- tapOn:
    text: Back
    leftOf: Next
- assertVisible: Card 1 of \d+
- tapOn: This looks wrong
- assertVisible: Thanks for telling us
- assertVisible: 'flag .*"contentKind":"card".*'
- repeat:
    while:
      notVisible: Done
    commands:
      - tapOn: Next
- tapOn: Done
- assertVisible:
    id: dev-answer

# Tap item, answered right.
- tapOn: ☰ Menu
- scrollUntilVisible:
    element: 'tap: k-count-to-20-tap-1'
    direction: DOWN
- tapOn: 'tap: k-count-to-20-tap-1'
- copyTextFrom:
    id: dev-answer
- tapOn: "${maestro.copiedText.replace('answer: ', '')}"
- assertVisible: Yes! Great job!
- assertVisible: 'answer .*"correct":true.*'

# Tap item, answered wrong: the "why" shows with the gentle feedback.
- tapOn: ☰ Menu
- scrollUntilVisible:
    element: 'tap: k-count-to-20-tap-2'
    direction: DOWN
- tapOn: 'tap: k-count-to-20-tap-2'
- copyTextFrom:
    id: dev-miss
- tapOn: "${maestro.copiedText.replace('miss: ', '')}"
- assertVisible: Good try!
- assertVisible: 'answer .*"correct":false.*'

# Keypad: type, delete, check. Then flag the item.
- tapOn: ☰ Menu
- scrollUntilVisible:
    element: 'keypad: k-count-to-20-keypad-1'
    direction: DOWN
- tapOn: 'keypad: k-count-to-20-keypad-1'
- assertVisible:
    text: Check my answer
    enabled: false
- tapOn: '1'
- tapOn: '6'
- assertVisible: Your answer, 16
- tapOn: Delete
- assertVisible: Your answer, 1
- tapOn: Delete
- assertVisible: Your answer, empty
- copyTextFrom:
    id: dev-answer
- evalScript: "${output.answer = maestro.copiedText.replace('answer: ', '')}"
- tapOn: '${output.answer.charAt(0)}'
- runFlow:
    when:
      true: '${output.answer.length > 1}'
    commands:
      - tapOn: '${output.answer.charAt(1)}'
- assertVisible: Your answer, ${output.answer}
- tapOn: Check my answer
- assertVisible: Yes! Great job!
- tapOn: This looks wrong
- assertVisible: Thanks for telling us
- assertVisible: 'flag .*"contentKind":"item".*'

# Number line: a tap on the track places the frog, the arrows move it, and the answer is logged.
- tapOn: ☰ Menu
- scrollUntilVisible:
    element: 'number-line: k-count-to-20-number-line-1'
    direction: DOWN
- tapOn: 'number-line: k-count-to-20-number-line-1'
- assertVisible:
    text: Check my answer
    enabled: false
- tapOn:
    id: number-line-track
- assertVisible:
    text: Check my answer
    enabled: true
- tapOn: Move right
- tapOn: Move left
- tapOn: Check my answer
- assertVisible: (Yes! Great job!|Good try!)
- assertVisible: 'answer .*"answer":\d+,.*'
